# Machine monitor broker. The plain listener 1883 is reachable only inside the compose network
# (ingest, simulators). In production the entrypoint adds MQTT over TLS on 8883 for collectors
# (MM_MQTT_TLS_DOMAIN, ADR 0010).
persistence true
persistence_location /mosquitto/data/
# Sessions and queued messages are written to disk every 5 s, so a hard crash of the
# broker loses at most the last 5 s of messages not yet delivered to ingest.
autosave_interval 5
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# ingest acknowledges a message only after the DB commit, so the in-flight
# window bounds its batch size; the queue holds data while ingest is down.
max_inflight_messages 500
max_queued_messages 1000000
