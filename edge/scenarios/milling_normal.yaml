name: milling_normal
description: Нормальная работа — серия циклов с короткими паузами на смену заготовки.
loop: true
program: O1234
initial_part_count: 15800
steps:
  - { state: run, duration_s: 540, program: O1234, cycle_time_s: 45, spindle_speed: 8000, feed: 1250, spindle_load: 37 }
  - { state: idle, duration_s: 40 }
  - { state: run, duration_s: 540, cycle_time_s: 45, spindle_speed: 8000, feed: 1250, spindle_load: 37 }
  - { state: hold, duration_s: 15 }
  - { state: run, duration_s: 270, cycle_time_s: 45, spindle_speed: 8000, feed: 1250, spindle_load: 37 }
  - { state: idle, duration_s: 60 }
