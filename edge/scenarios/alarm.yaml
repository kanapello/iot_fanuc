name: alarm
description: Аварии серво и аварийный останов во время работы, восстановление.
loop: true
program: O3100
initial_part_count: 42
steps:
  - { state: run, duration_s: 720, program: O3100, cycle_time_s: 60, load_time_s: 12, spindle_speed: 6000, feed: 1000, spindle_load: 37 }
  - { state: alarm, duration_s: 150, alarm: { code: SV0401, message: "V-READY OFF", category: servo } }
  - { state: idle, duration_s: 60 }
  - { state: run, duration_s: 1080, program: O3100, cycle_time_s: 60, load_time_s: 12, spindle_speed: 6000, feed: 1000, spindle_load: 37 }
  - { state: alarm, duration_s: 70, emergency: true, alarm: { code: EX1000, message: "EMERGENCY STOP", category: external } }
  - { state: idle, duration_s: 200 }
  - { state: run, duration_s: 864, program: O3100, cycle_time_s: 60, load_time_s: 12, spindle_speed: 6000, feed: 1000, spindle_load: 37 }
  - { state: idle, duration_s: 45 }
