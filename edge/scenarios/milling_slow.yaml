name: milling_slow
description: Как milling_normal, но у программы O1250 машинное время дольше (100 с при норме 85 с) — демо «циклы медленнее нормы».
loop: true
program: O1234
initial_part_count: 15800
steps:
  - { state: run, duration_s: 1100, program: O1234, cycle_time_s: 45, load_time_s: 10, spindle_speed: 8000, feed: 1250, spindle_load: 37 }
  - { state: idle, duration_s: 50 }
  - { state: run, duration_s: 1650, program: O1234, cycle_time_s: 45, load_time_s: 10, spindle_speed: 8000, feed: 1250, spindle_load: 37 }
  - { state: hold, duration_s: 20 }
  - { state: run, duration_s: 825, program: O1234, cycle_time_s: 45, load_time_s: 10, spindle_speed: 8000, feed: 1250, spindle_load: 37 }
  - { state: setup, duration_s: 240, mode: JOG, program: O1250 }
  - { state: run, duration_s: 2300, program: O1250, cycle_time_s: 100, load_time_s: 15, spindle_speed: 4700, feed: 800, spindle_load: 52 }
  - { state: idle, duration_s: 90 }
  - { state: run, duration_s: 1725, program: O1250, cycle_time_s: 100, load_time_s: 15, spindle_speed: 4700, feed: 800, spindle_load: 52 }
  - { state: setup, duration_s: 200, mode: EDIT, program: O1234 }
