name: counter_reset
description: Оператор сбрасывает счётчик деталей между партиями (значение уменьшается до 0).
loop: true
program: O5005
initial_part_count: 9990
steps:
  - { state: run, duration_s: 200, program: O5005, cycle_time_s: 20, spindle_speed: 5000, feed: 900 }
  - { state: idle, duration_s: 30 }
  - { state: counter_reset }
  - { state: run, duration_s: 200, cycle_time_s: 20, spindle_speed: 5000, feed: 900 }
  - { state: idle, duration_s: 40 }
