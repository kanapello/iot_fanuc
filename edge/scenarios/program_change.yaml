name: program_change
description: Переналадка — смена программы через режим наладки (EDIT/JOG), другая норма цикла.
loop: true
program: O6001
initial_part_count: 100
steps:
  - { state: run, duration_s: 240, program: O6001, cycle_time_s: 40, spindle_speed: 6500, feed: 1000 }
  - { state: setup, duration_s: 60, mode: EDIT, program: O6002 }
  - { state: setup, duration_s: 90, mode: JOG }
  - { state: run, duration_s: 300, cycle_time_s: 75, spindle_speed: 3000, feed: 600, spindle_load: 55 }
  - { state: setup, duration_s: 120, mode: MDI, program: O6001 }
