# Simulator collector used by `make up` (compose profile "dev").
# On the first start each machine replays 21 days of history (the overview compares with the previous
# period and the same weekdays): the last 72 hours with a 5 s step, the older part with a 30 s step.
# A few machines follow a worse profile for the last 12 hours (recent_profile): "below usual" and
# "slower than the norm" of the overview are not empty on the demo stand.
org: demo
site: plant2
collector_id: edge-sim-b
mqtt:
  host: mosquitto
  port: 1883
  tls: false   # inside the compose network of the server; a real collector uses TLS (8883)
  username: edge-sim-b
  password_env: MM_MQTT_PASSWORD
buffer:
  path: /app/data/buffer.db
# The demo charts need feed, spindle speed and load: enabled explicitly (the default is the minimum).
machines:
  - { id: sim04, driver: simulator, backfill_hours: 504, profile: connection_loss, offset_s: 700, signals: &demo_signals [status, program, part_count, alarms, feed_actual, spindle_speed, spindle_load] }
  - { id: sim05, driver: simulator, backfill_hours: 504, recent_profile: program_change_stops, recent_hours: 12, profile: program_change, offset_s: 200, signals: *demo_signals }
  - { id: sim06, driver: simulator, backfill_hours: 504, profile: counter_reset, offset_s: 100, signals: *demo_signals }
