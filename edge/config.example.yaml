# Example collector config. Copy to config.yaml and adjust.
org: demo                          # organization code (given by the service administrator)
site: plant1                       # site code inside the organization
collector_id: edge-shop1
mqtt:
  host: mm-server.local
  port: 8883
  tls: true
  username: edge-shop1
  password_env: MM_MQTT_PASSWORD   # the password itself is taken from this environment variable
focas:
  library_path: ./vendor/Fwlib64.dll
buffer:                            # store-and-forward buffer
  path: ./data/buffer.db
  max_age_days: 7
machines:
  - id: m07
    name: "Фрезерный 07"
    driver: fanuc_focas
    ip: 192.168.10.57
    port: 8193
    poll_interval_ms: 1000         # 1000 by default; 2000-5000 if the control answers slowly
    part_counter: { source: macro, address: 3901 }
    # What is read. The minimum (default) is enough for the timeline and OEE. Add feed_actual,
    # spindle_speed, spindle_load only after `focas_probe.py --recon` and timing on this control.
    signals: [status, program, part_count, alarms]
  - id: sim01
    driver: simulator
    profile: milling_normal
