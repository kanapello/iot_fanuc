[project]
name = "mm-edge"
version = "0.4.0"
description = "Machine monitor edge collector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "types-PyYAML",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in user-facing messages is intentional

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
