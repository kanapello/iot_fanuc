# Checks of every pull request and of main. The branch protection of main requires
# every job below to be green before a pull request can be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      # integration tests start PostgreSQL + TimescaleDB and Mosquitto with testcontainers
      - name: pytest
        run: uv run pytest -q

  edge:
    name: edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: edge/uv.lock
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy collector
      # the FOCAS tests compile a fake Fwlib with gcc
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build (tsc + vite)
        run: pnpm build

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shell scripts
        run: shellcheck -s sh deploy/mosquitto/docker-entrypoint.sh deploy/backup/mm-backup.sh deploy/scripts/env-prod.sh
      - name: compose files (dev, prod)
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml --profile dev config -q
          rm .env
          sh deploy/scripts/env-prod.sh mm.example.com ops@example.com
          docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config -q
      - name: Caddyfile
        run: >
          docker run --rm -e MM_DOMAIN=mm.example.com -e MM_ACME_EMAIL=ops@example.com
          -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  images:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            file: backend/Dockerfile
          - image: web
            file: frontend/Dockerfile
          - image: edge
            file: edge/Dockerfile
          - image: backup
            file: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: machine-monitor/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
