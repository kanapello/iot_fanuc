# Scheme the browser used: from an outer HTTPS proxy, if there is one, else our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # originals of ballbar tests (.b5r, PDF reports) are uploaded through the API
        client_max_body_size 30m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # the address the browser used, with the port: links on QR stickers (MM_PUBLIC_URL overrides)
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
