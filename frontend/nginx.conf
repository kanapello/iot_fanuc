# Scheme the browser used: from an outer HTTPS proxy, if there is one, else our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # an add_header inside a location replaces these: /assets/ repeats them (ADR 0010)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        # originals of ballbar tests (.b5r, PDF reports) are uploaded through the API
        client_max_body_size 30m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # the address the request came from: the limit on failed logins counts by it
        proxy_set_header X-Real-IP $remote_addr;
        # the API sets the security headers too: keep one copy (a doubled X-Frame-Options may be ignored)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # the address the browser used, with the port: links on QR stickers (MM_PUBLIC_URL overrides)
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri /index.html;
    }
}
